name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # NPM_TOKEN must be an "Automation" classic token to skip OTP.
    # Granular tokens trigger EOTP and fail this step; the rest of the
    # release (binaries + GH release) carries on regardless.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build workspace packages
        run: bun run --filter '@agent-cv/sync-schema' build
      - name: Test
        run: bun test
      - name: Build npm bundle
        run: bun run build:npm
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: agent-cv-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: agent-cv-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: agent-cv-linux-x64
          # darwin-x64 is cross-compiled from macos-latest (Apple Silicon).
          # Bun's --compile --target bun-darwin-x64 supports cross-targets
          # so we don't need a scarce macos-13 Intel runner.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build workspace packages
        run: bun run --filter '@agent-cv/sync-schema' build
      - run: bun build src/cli.ts --compile --outfile dist/${{ matrix.artifact }} --minify --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  create-release:
    # publish-npm runs continue-on-error, so binaries+release proceed even
    # when EOTP blocks the npm step.
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/agent-cv-darwin-arm64/agent-cv-darwin-arm64
            artifacts/agent-cv-darwin-x64/agent-cv-darwin-x64
            artifacts/agent-cv-linux-x64/agent-cv-linux-x64
          generate_release_notes: true
